name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-api:
    name: API Lint, Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Lint API
        run: pnpm --filter api lint

      - name: Typecheck API build
        run: pnpm --filter api exec tsc --noEmit --incremental false -p tsconfig.build.json

      - name: Run API unit tests
        run: pnpm --filter api exec vitest run --configLoader native

      - name: Build API
        run: pnpm --filter api build

  e2e-api:
    name: API E2E Tests (PostgreSQL + RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Initialize test database roles & DBs
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -f apps/api/prisma/setup.sql

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate

      - name: Apply Prisma migrations to hrms_test
        env:
          DATABASE_URL: postgresql://hrms_owner:hrms_owner_dev@localhost:5432/hrms_test
          OWNER_DATABASE_URL: postgresql://hrms_owner:hrms_owner_dev@localhost:5432/hrms_test
          APP_DATABASE_URL: postgresql://hrms_app:hrms_app_dev@localhost:5432/hrms_test
        run: pnpm --filter api exec prisma migrate deploy

      - name: Run API E2E suite
        run: pnpm --filter api exec vitest run --config ./vitest.config.e2e.ts --configLoader native

  verify-web:
    name: Web Typecheck, Lint & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web utility tests
        run: node --test apps/web/lib/proxy-url.test.ts

      - name: Typecheck Web
        run: pnpm --filter web exec tsc --noEmit --incremental false

      - name: Lint deployment & core web helper files
        run: pnpm --filter web exec eslint "lib/api.ts" "lib/proxy-url.ts" "components/user-avatar.tsx" "next.config.ts"

      - name: Build Next.js Web app
        run: pnpm --filter web build

  verify-docker:
    name: Verify API Dockerfile Build
    needs: [verify-api]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production API container image
        run: docker build -f apps/api/Dockerfile -t azir-hris-api:ci .
